name: release
# Publish @thegoldenmule/ghx to npm when a v* tag is pushed. npm trusted publishing: the job's OIDC
# token proves it is this repo's release.yml, so there is no NODE_AUTH_TOKEN secret, and npm attaches
# provenance. One-time setup and the release steps are in RELEASING.md.
on:
  push:
    tags: ["v*"]
permissions:
  id-token: write # npm trusted publishing (OIDC) and provenance
  contents: read
concurrency: { group: "release-${{ github.ref }}", cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: { GHX_ARTIFACT_DIR: "${{ runner.temp }}/ghx" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
      - name: The tag matches the package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version} (want v${version})"
            exit 1
          fi
      - name: npm >= 11.5.1 (trusted publishing)
        run: |
          if ! node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)"; then
            npm install -g npm@11
          fi
          npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm docs:check
      - run: pnpm pack:test
      - name: npm publish (trusted publishing, with provenance)
        run: npm publish

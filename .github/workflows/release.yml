name: release
# On a v* tag: check, build the standalone ghx binaries (Bun --compile) for darwin/linux x64/arm64,
# test each archive on its own runner, attest the assets and publish a GitHub release, then run the
# published install.sh one-liner. npm publishing is gated on the NPM_PUBLISH repo variable.
# workflow_dispatch is a dry run: it builds, tests and uploads the assets as a workflow artifact, and
# publishes nothing. The release steps are in RELEASING.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: "release-${{ github.ref }}", cancel-in-progress: false }
env:
  BUN_VERSION: "1.4.4"
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      # The runner context is not available in job-level env, so the artifact dir is set from a step.
      - run: echo "GHX_ARTIFACT_DIR=$RUNNER_TEMP/ghx" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, cache: pnpm }
      - name: The tag matches the package.json version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_EVENT_NAME}" = push ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version} (want v${version})"
            exit 1
          fi
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm docs:check
      - run: pnpm pack:test

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, cache: pnpm }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - run: pnpm install --frozen-lockfile
      # The contract suite's signal tests need the test commands, which the release binaries leave out.
      - name: Build the test-hooks binaries
        run: |
          pnpm build:bin --target all --test-hooks
          mv dist-bin "$RUNNER_TEMP/bin-test"
      - name: Build the release binaries
        run: pnpm build:bin --target all
      - name: Assemble the release assets
        run: |
          assets="$RUNNER_TEMP/assets"
          mkdir -p "$assets"
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            bin="dist-bin/ghx-$target"
            [ -f "$bin" ] || { echo "::error::missing $bin"; exit 1; }
            stage="$RUNNER_TEMP/stage-$target"
            mkdir -p "$stage"
            cp "$bin" "$stage/ghx"
            chmod 755 "$stage/ghx"
            tar -czf "$assets/ghx-$target.tar.gz" -C "$stage" --owner=0 --group=0 --numeric-owner ghx
          done
          # The npm package, for Node.js users (and Windows): a version-free name keeps the
          # releases/latest/download/ghx.tgz URL stable.
          pnpm build
          npm pack --silent --pack-destination "$RUNNER_TEMP"
          mv "$RUNNER_TEMP"/thegoldenmule-ghx-*.tgz "$assets/ghx.tgz"
          cp install.sh "$assets/install.sh"
          (cd "$assets" && sha256sum ghx-*.tar.gz ghx.tgz install.sh > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-binaries
          path: ${{ runner.temp }}/bin-test/
          if-no-files-found: error

  test:
    # Each archive on a native runner: install.sh picks it by uname, then the contract suite and the
    # end-to-end smoke test run against the installed binary.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: linux-x64 }
          - { runner: ubuntu-24.04-arm, target: linux-arm64 }
          - { runner: macos-15, target: darwin-arm64 }
          - { runner: macos-15-intel, target: darwin-x64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - run: echo "GHX_ARTIFACT_DIR=$RUNNER_TEMP/ghx" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: release-assets, path: "${{ runner.temp }}/assets" }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: test-binaries, path: "${{ runner.temp }}/bin-test" }
      - name: install.sh installs ghx-${{ matrix.target }}.tar.gz from the assets
        shell: bash # -eo pipefail: a failed install fails the tee
        run: |
          GHX_BASE_URL="file://$RUNNER_TEMP/assets" GHX_INSTALL_DIR="$RUNNER_TEMP/bin" sh "$RUNNER_TEMP/assets/install.sh" | tee install.log
          grep -q "ghx-${{ matrix.target }}.tar.gz" install.log
          echo "GHX_BIN=$RUNNER_TEMP/bin/ghx" >> "$GITHUB_ENV"
      - name: The binary is signed (Apple silicon refuses to run unsigned code)
        if: runner.os == 'macOS'
        run: codesign -v --verbose=2 "$GHX_BIN"
      - name: Contract tests against the test-hooks binary
        run: |
          chmod 755 "$RUNNER_TEMP"/bin-test/ghx-*
          GHX_TEST_BIN="$RUNNER_TEMP/bin-test/ghx-${{ matrix.target }}" pnpm test:contract
      - name: Smoke test the release binary
        run: pnpm bin:test --bin "$GHX_BIN"

  release:
    if: github.event_name == 'push'
    needs: [check, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      id-token: write # sign the attestations
      attestations: write
      artifact-metadata: write
    env:
      TAG: ${{ needs.check.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: release-assets, path: "${{ runner.temp }}/assets" }
      - name: Check the assets against SHA256SUMS
        run: cd "$RUNNER_TEMP/assets" && sha256sum -c SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/assets/ghx-*.tar.gz
            ${{ runner.temp }}/assets/ghx.tgz
            ${{ runner.temp }}/assets/install.sh
            ${{ runner.temp }}/assets/SHA256SUMS
      - name: Publish the GitHub release
        run: |
          # Notes: docs/release-notes/<tag>.md when it exists, else GitHub's generated notes.
          notes=(--generate-notes)
          if [ -f "docs/release-notes/$TAG.md" ]; then notes=(--notes-file "docs/release-notes/$TAG.md"); fi
          assets=("$RUNNER_TEMP"/assets/*)
          # A re-run after a partial failure finds its own draft; refresh its assets instead of failing.
          if draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" != true ]; then
              echo "::error::release $TAG is already published"
              exit 1
            fi
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" --draft --verify-tag --title "$TAG" "${notes[@]}" "${assets[@]}"
          fi
          # Not a pre-release: releases/latest/download ignores pre-releases.
          gh release edit "$TAG" --draft=false --latest

  verify-install:
    # The published one-liner, as a user runs it.
    needs: [check, release]
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-24.04, macos-15] }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - name: curl install.sh | sh
        shell: bash # -eo pipefail: a failed curl fails the pipe
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/install.sh"
          # Release assets can 404 for a few seconds after the release leaves draft.
          for attempt in 1 2 3 4 5; do
            if curl -fsSL "$url" | GHX_VERSION="$TAG" sh; then break; fi
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep 10
          done
      - name: ghx --version reports the tag
        run: |
          version="$("$HOME/.local/bin/ghx" --version | jq -r .version)"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::installed ghx reports $version, want ${TAG#v}"
            exit 1
          fi
          echo "ghx $version"

  npm:
    # npm can link a trusted publisher only to an existing package, so the first version is published
    # by hand (RELEASING.md); set the NPM_PUBLISH repo variable to "true" after that. Gated on the
    # binary tests too: a publish can't be taken back.
    if: github.event_name == 'push' && vars.NPM_PUBLISH == 'true'
    needs: [check, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
      - name: npm >= 11.5.1 (trusted publishing)
        run: |
          if ! node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)"; then
            npm install -g npm@11
          fi
          npm --version
      - run: pnpm install --frozen-lockfile
      - name: npm publish (trusted publishing, with provenance)
        run: npm publish

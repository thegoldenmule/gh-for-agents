name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
jobs:
  check:
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      # The runner context is not available in job-level env, so the artifact dir is set from a step.
      - run: echo "GHX_ARTIFACT_DIR=$RUNNER_TEMP/ghx" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Unit, command, regression tests
        run: node --test --test-reporter=dot "test/{unit,commands,regression}/**/*.test.ts" "test/*.test.ts"
      - name: Contract tests (spawn bin with fake gh)
        run: node --test --test-reporter=dot "test/contract/**/*.contract.test.ts"
      - name: Coverage gate
        if: matrix.os == 'ubuntu-latest'
        run: pnpm test:coverage
      - run: pnpm docs:check # docs/agents command reference and skill are not stale
  pack-test:
    # Build, npm pack, install the tarball into a temp global prefix, and drive the installed ghx.
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm pack:test
  binary:
    # Build the standalone binary for this runner and drive it end to end, so the Bun build can't break
    # silently between releases. The release workflow builds and tests every target.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck -s sh install.sh # preinstalled on ubuntu runners
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, cache: pnpm }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: "1.4.4" } # keep in step with BUN_VERSION in release.yml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:bin
      - run: pnpm bin:test --bin dist-bin/ghx-linux-x64
      - name: install.sh installs it from a local release
        run: |
          rel="$RUNNER_TEMP/rel"
          mkdir -p "$rel/stage"
          cp dist-bin/ghx-linux-x64 "$rel/stage/ghx"
          tar -czf "$rel/ghx-linux-x64.tar.gz" -C "$rel/stage" ghx
          (cd "$rel" && sha256sum ghx-linux-x64.tar.gz > SHA256SUMS)
          GHX_BASE_URL="file://$rel" GHX_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          "$RUNNER_TEMP/bin/ghx" --version
